<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- viewport-fit=cover lets the installed app run under the notch.
         Without it iOS letterboxes it with white bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />

    <title>The Cockpit</title>
    <meta name="description" content="Daily operations rundown for V Spot Media." />

    <link rel="icon" type="image/png" href="/vspot-media-touch.png" />

    <!-- Home screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#151C34" />
    <meta name="application-name" content="The Cockpit" />

    <!-- iOS still wants its own tags rather than reading the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cockpit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/vspot-media-touch.png" />

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="V Spot Media" />
    <meta property="og:description" content="Drafted 2026." />
    <meta property="og:image" content="/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      /* Respect the notch and the home indicator when installed. */
      body {
        margin: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #F4EDE1;
      }
      /* No rubber-band bounce past the edges. It is the clearest tell that
         something is a website rather than an app. */
      html { overscroll-behavior-y: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
