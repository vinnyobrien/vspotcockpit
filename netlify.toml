[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Everything under /api goes to a function of the same name.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The X Desk renders from a function, so give it a clean address.
# This must sit above the SPA fallback or the shell swallows it.
[[redirects]]
  from = "/xdesk"
  to = "/.netlify/functions/xdesk-page"
  status = 200

[[redirects]]
  from = "/xdesk/*"
  to = "/.netlify/functions/xdesk-page"
  status = 200

# SPA fallback, but never swallow the API routes above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # microphone=(self) not (), or the Essay room's dictation is blocked at the
    # document level before the browser ever asks the user. Camera and
    # geolocation stay off; nothing here needs them.
    Permissions-Policy = "geolocation=(), microphone=(self), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Opus serves clip thumbnails and previews from its signed CDN, so img-src
    # and media-src have to name it or the cards render blank with no error.
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://signed-ext.cdn.opus.pro; img-src 'self' data: https://signed-ext.cdn.opus.pro; media-src 'self' blob: https://signed-ext.cdn.opus.pro; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# The LinkedIn archive payload contains his published contact address, published in the
# Le Sunday Supplement piece. It matches RESEND_REPLY_TO and trips the scanner.
# Scoped to the seed directory only, and removed with it after seeding.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "netlify/functions/_seed/*"
